name: Supabase bijwerken

# Zet de databasemigraties en serverfuncties live op Supabase zodra een
# wijziging in supabase/ op main komt (dus na het mergen van een pull request).
# Met de hand te starten via Actions → Supabase bijwerken → Run workflow.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migraties en functies live zetten
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: wrdhjzvgdwatdqubouuk
      # CLI 3.x vraagt bevestiging voor wijzigingen aan het live project.
      SUPABASE_YES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Koppelen aan het project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Migraties toepassen
        # Zonder --remote kiest CLI 3.x de lokale database.
        # --include-all: ook een migratie met een eerder tijdstempel dan de
        # laatste live migratie meenemen (gebeurt als pull requests in een
        # andere volgorde gemerged worden dan ze gemaakt zijn). Zonder deze
        # optie weigert db push en blijft alles daarna hangen.
        run: supabase db push --remote --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Serverfuncties bijwerken
        run: |
          supabase functions deploy results-export --use-api
          supabase functions deploy photobook --use-api
          supabase functions deploy opruimen --use-api
