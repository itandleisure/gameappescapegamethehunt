name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    name: Spelregel-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:functions
      - name: Beheeromgeving bouwen
        run: pnpm --filter @hunt/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  screens:
    name: Schermcontrole speler-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hunt/player exec playwright install --with-deps chromium
      # Alle schermen op 7 schermmaten, met grote, kleine en rare foto's.
      - run: pnpm --filter @hunt/player screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermafbeeldingen
          path: apps/player/screens/

  database:
    name: Database en toegangsregels
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-db.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
